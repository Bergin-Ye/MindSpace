server:
  port: 8080

spring:
  application:
    name: mindspace
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mindspace?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  jackson:
    time-zone: Asia/Shanghai

  ai:
    openai:
      # Spring AI 用根地址，不要带 /v1
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      # 没配 key 时用 dummy 占位，保证项目能启动；SpringAiClient 会检查并返回 3004
      api-key: ${AI_API_KEY:dummy}
      chat:
        # 默认就是 /v1/chat/completions，这里显式写出来方便理解
        completions-path: /v1/chat/completions
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:MindSpace-Dev-Secret-Key-Change-Me-2026-At-Least-32-Bytes}
  expiration: 86400000

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

ai:
  # 原生 RestClient 版本使用；Spring AI 版本不读这些，除了 max-input-length
  base-url: ${AI_NATIVE_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-chat}
  timeout-seconds: 60
  max-input-length: 8000

parse:
  pool:
    core-size: 2
    max-size: 4
    queue-capacity: 50

embedding:
  # 默认本地 Ollama 的 OpenAI 兼容接口
  base-url: ${EMBEDDING_BASE_URL:http://localhost:11434/v1}
  api-key: ${EMBEDDING_API_KEY:ollama}
  model: ${EMBEDDING_MODEL:bge-m3}
  timeout-seconds: 60
  batch-size: 16
  chunk-size: 500
  chunk-overlap: 100
  max-chunks-per-document: 200
  max-search-chunks: 5000

chat:
  top-k: 5
  history-size: 6